<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#27436B"/>
      <stop offset="0.55" stop-color="#0F2A5C"/>
      <stop offset="1" stop-color="#081839"/>
    </linearGradient>
    <radialGradient id="disc" cx="0.38" cy="0.32" r="0.8">
      <stop offset="0" stop-color="#F0AE86"/>
      <stop offset="0.5" stop-color="#CC825B"/>
      <stop offset="1" stop-color="#8A3A15"/>
    </radialGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.55" stop-color="#CC825B" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#CC825B" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clip"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <circle cx="262" cy="268" r="215" fill="url(#halo)"/>
    <circle cx="262" cy="268" r="150" fill="url(#disc)"/>
    <circle cx="262" cy="268" r="172" fill="none" stroke="#CC825B" stroke-width="5" opacity="0.8"/>
    <!-- little drops, like on the petals -->
    <circle cx="378" cy="150" r="9" fill="#E8A982"/>
    <circle cx="150" cy="168" r="6" fill="#E8A982" opacity="0.8"/>
    <!-- dotted trail behind the plane: "sent" -->
    <path d="M112 396 Q172 376 224 340" fill="none" stroke="#E9E1D6" stroke-width="15" stroke-linecap="round" stroke-dasharray="1 30"/>
    <!-- paper plane -->
    <g transform="translate(262 262) scale(1.1) translate(-260 -258)">
      <path d="M168 254 L352 170 L264 298 Z" fill="#F6EFE4"/>
      <path d="M352 170 L304 346 L264 298 Z" fill="#E9C4A8"/>
      <path d="M264 298 L304 346 L252 330 Z" fill="#612105"/>
    </g>
  </g>
</svg>
